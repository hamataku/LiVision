name: pypi

# Builds the source distribution, verifies it installs, and publishes it to
# PyPI on version tags (v0.3.7 ...). Uses PyPI trusted publishing (OIDC), so
# no API token is stored in the repository; register this workflow as a
# trusted publisher on https://pypi.org/manage/project/livision/settings/publishing/
# (or as a pending publisher before the first release).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  verify:
    needs: sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build dependencies
        run: |
          sudo add-apt-repository ppa:hamatakuzaq/livision
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libeigen3-dev libsdformat14-dev libassimp-dev libcurl4-openssl-dev
      - name: Install from sdist and import
        run: |
          python -m pip install dist/*.tar.gz
          cd / && python -c "import livision as lv; print(lv.__version__); lv.Box(pos=[0, 0, 1])"

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
